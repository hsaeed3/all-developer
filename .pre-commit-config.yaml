default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch # no direct commit to the main branch
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: lint
        name: Lint (make lint)
        entry: make lint
        types: [python]
        language: system
        pass_filenames: false
      - id: lint-skill
        name: Check the skill (make lint-skill)
        entry: make lint-skill
        language: system
        pass_filenames: false
        always_run: true
      - id: check
        name: Check (lint, skill, spelling and types)
        entry: make lint lint-skill spellcheck typecheck
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
